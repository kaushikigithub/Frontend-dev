<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Responsive Photo Gallery — CSS Grid</title>
  <link rel="stylesheet" href="photo-gallery.css">
</head>
<body>
  <main class="gallery">
    <figure class="item">
      <img src="https://via.placeholder.com/800x600.png?text=Photo+1" alt="Photo 1">
      <figcaption>Photo 1 caption</figcaption>
    </figure>

    <figure class="item">
      <img src="https://via.placeholder.com/800x600.png?text=Photo+2" alt="Photo 2">
      <figcaption>Photo 2 caption</figcaption>
    </figure>

    <figure class="item">
      <img src="https://via.placeholder.com/800x600.png?text=Photo+3" alt="Photo 3">
      <figcaption>Photo 3 caption</figcaption>
    </figure>

    <figure class="item">
      <img src="https://via.placeholder.com/800x600.png?text=Photo+4" alt="Photo 4">
      <figcaption>Photo 4 caption</figcaption>
    </figure>
  </main>
</body>
</html>
