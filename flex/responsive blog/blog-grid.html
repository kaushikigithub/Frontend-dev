<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Responsive Blog Layout — CSS Grid</title>
  <link rel="stylesheet" href="blog-grid.css">
</head>
<body>
  <div class="site">
    <header class="site-header">
      <h1>My Blog</h1>
      <nav><a href="#">Home</a> <a href="#">About</a> <a href="#">Contact</a></nav>
    </header>

    <main class="site-main">
      <article class="post">
        <h2>Post One</h2>
        <p>Short excerpt of the first blog post.</p>
      </article>

      <article class="post">
        <h2>Post Two</h2>
        <p>Short excerpt of the second blog post.</p>
      </article>

      <aside class="sidebar">
        <h3>Categories</h3>
        <ul>
          <li>Web Development</li>
          <li>Design</li>
          <li>Productivity</li>
        </ul>
      </aside>
    </main>

    <footer class="site-footer">
      <p>Contact: kaushiki@example.com</p>
    </footer>
  </div>
</body>
</html>
