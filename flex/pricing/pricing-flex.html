<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pricing Plans — Flexbox</title>
  <link rel="stylesheet" href="pricing-flex.css">
</head>
<body>
  <main class="pricing">
    <article class="card"> 
      <h3>Basic</h3>
      <p class="price">₹499</p>
      <p>Essential features for personal use.</p>
    </article>

    <article class="card featured">
      <h3>Pro</h3>
      <p class="price">₹999</p>
      <p>Best for professionals and freelancers.</p>
    </article>

    <article class="card">
      <h3>Business</h3>
      <p class="price">₹1,999</p>
      <p>Advanced features for teams.</p>
    </article>
  </main>
</body>
</html>
