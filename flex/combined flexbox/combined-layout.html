<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Combined Flex + Grid Layout — Responsive</title>
  <link rel="stylesheet" href="combined-layout.css">
</head>
<body>
  <div class="site">
    <header class="topbar">
      <div class="logo">MyLogo</div>
      <nav class="topnav">
        <a href="#">Home</a><a href="#">Blog</a><a href="#">Contact</a>
      </nav>
    </header>

    <main class="main-grid">
      <article class="article">
        <h1 class="animated-title">Welcome to My Article</h1>
        <div class="feature-row">
          <div class="box">Box A</div>
          <div class="box">Box B</div>
          <div class="box">Box C</div>
        </div>
        <p>Article content goes here. The three boxes above demonstrate flexbox inside the grid article column.</p>
      </article>

      <aside class="sidebar">
        <h3>Sidebar</h3>
        <p>Short sidebar content.</p>
      </aside>
    </main>

    <footer class="site-footer">
      <p>© 2025 Kaushiki Mishra</p>
    </footer>
  </div>
</body>
</html>
