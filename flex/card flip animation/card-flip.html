<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="card-flip.css">
</head>
<body>
  <div class="center">
    <div class="card">
      <div class="card__inner">
        <div class="card__face card__front">
          <h3>Card Title</h3>
          <img src="https://via.placeholder.com/280x160.png?text=Image" alt="Front image">
        </div>
        <div class="card__face card__back">
          <p>This is the back side description of the card. It appears after flip.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
