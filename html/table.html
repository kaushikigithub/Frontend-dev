<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Marks Table</title>
</head>
<body>

  <h2>Student Marks</h2>
  <table border="1">
    <tr>
      <th>Name</th>
      <th>Subject</th>
      <th>Marks</th>
    </tr>
    <tr>
      <td>Kaushiki</td>
      <td>HTML</td>
      <td>95</td>
    </tr>
    <tr>
      <td>Riya</td>
      <td>CSS</td>
      <td>90</td>
    </tr>
  </table>
</body>
</html>
