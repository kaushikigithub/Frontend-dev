<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Definition List Example</title>
</head>
<body>
  <!-- Definition list example -->
  <h2>Web Development Terms</h2>
  <dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language — used to create webpage structure.</dd>

    <dt>CSS</dt>
    <dd>Cascading Style Sheets — used for styling web pages.</dd>

    <dt>JavaScript</dt>
    <dd>Programming language that adds interactivity to web pages.</dd>
  </dl>
</body>
</html>
