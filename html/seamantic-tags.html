<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Semantic Tags Example</title>
</head>
<body>
  <!-- Demonstration of semantic tags -->
  <header>
    <h1>My Blog</h1>
  </header>

  <article>
    <h2>Importance of Semantic HTML</h2>
    <p>Semantic tags like <code>&lt;header&gt;</code>, <code>&lt;article&gt;</code>, and <code>&lt;footer&gt;</code> make webpages more meaningful and SEO-friendly.</p>
  </article>

  <footer>
    <p>Written by Kaushiki Mishra, 2025</p>
  </footer>
</body>
</html>
